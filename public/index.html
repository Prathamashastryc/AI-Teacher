<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Chat</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <button class="new-chat" id="newChat">
                <span>＋</span>
                New chat
            </button>

            <div class="history" id="history"></div>

        </div>

        <div class="sidebar-bottom">

            <button class="side-button" id="themeButton">
                ◐
                <span>Toggle theme</span>
            </button>

            <div class="account">
                <div class="avatar">AI</div>
                <div>
                    <strong>OpenRouter</strong>
                    <small>AI Chat</small>
                </div>
            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <button class="menu" id="menu">
                ☰
            </button>

            <div class="model-wrapper">

                <select id="model">

                    <option value="openrouter/free">
                        OpenRouter Free
                    </option>

                    <option value="openai/gpt-4o">
                        GPT-4o
                    </option>

                    <option value="anthropic/claude-sonnet-4">
                        Claude Sonnet
                    </option>

                    <option value="google/gemini-2.5-flash">
                        Gemini 2.5 Flash
                    </option>

                    <option value="deepseek/deepseek-chat-v3-0324">
                        DeepSeek V3
                    </option>

                </select>

            </div>

        </header>


        <!-- CHAT -->

        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="logo">✦</div>

                <h1>How can I help?</h1>

                <p>
                    Ask anything and choose an OpenRouter model above.
                </p>

                <div class="suggestions">

                    <button onclick="usePrompt('Explain quantum computing simply')">
                        Explain quantum computing
                    </button>

                    <button onclick="usePrompt('Write a Python program for a calculator')">
                        Write some code
                    </button>

                    <button onclick="usePrompt('Give me ideas for a project')">
                        Brainstorm ideas
                    </button>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <div class="composer-area">

            <form class="composer" id="composer">

                <textarea
                    id="input"
                    placeholder="Message AI..."
                    rows="1"
                    autocomplete="off"
                ></textarea>

                <button
                    type="submit"
                    class="send"
                    id="send"
                >
                    ↑
                </button>

            </form>

            <div class="disclaimer">
                AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
